name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Sprawdź obliczenia wykresu
        run: npm run test:chart
      - name: Zbuduj stronę
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Sprawdź statyczny wynik
        run: npm run check:site
      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj pliki do publikacji
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
